<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SPY</title>
</head>
<!-- Quang's SPY desk — adjusted version
     Kept from your file: AMEX:SPY, 5-min default, dark theme, America/Chicago.
     Added: SMA 20 + SMA 50 (your break rule needs SMA 20), EMA 21 back
     alongside EMA 9, VIX panel, toolbar + symbol change on (flip 2m /
     15m / 1h without editing code).
     IMPORTANT — read the legend: a study is only on the chart if it is
     listed in the legend at the chart's top-left. It should list VWAP,
     Moving Average x2 and Moving Average Exponential x2. If EMA is not
     in the legend, it did not load — night does not hide it; after the
     close the line just flattens onto the last price.
     All studies below are in object form on purpose: mixing a plain
     string with objects makes the widget silently drop the objects —
     that is what ate the EMAs before.
     Colors are set per study via overrides: VWAP blue, SMA 20 orange,
     SMA 50 gray, EMA 9 cyan, EMA 21 pink — so the lines and their
     legend values are tellable apart instead of all rendering blue.
     You do not need both MA and EMA families: the break rule uses
     VWAP + SMA 20, your style line is EMA 9; SMA 50 and EMA 21 are
     optional slower context — delete those two entries if unwanted.
     By hand once: draw Fib retracement 726.79 (Wed Nov 18 low) -> 763.03
     (Nov 12 high). Levels: 78.6% 734.55 / 61.8% 740.63 / 50% 744.91 /
     38.2% 749.19 / 23.6% 754.48. Prev close (Wed): 730.20.
     Volume profile (POC/VAH/VAL) is a paid TradingView study — the free
     embed cannot add it from code. -->
<body style="margin:0;height:100vh;background:#000;display:flex;flex-direction:column">
  <div id="tv_spy" style="flex:1"></div>
  <div id="tv_vix" style="height:22%"></div>
  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    var STUDIES = [
      { id: "VWAP@tv-basicstudies" },
      { id: "MASimple@tv-basicstudies", inputs: { length: 20 } },
      { id: "MAExp@tv-basicstudies",    inputs: { length: 9 } }
    ];

    function makeChart(id, symbol, interval, studies) {
      new TradingView.widget({
        container_id: id,
        symbol: symbol,
        interval: interval,
        theme: "dark",
        style: "1",
        locale: "en",
        autosize: true,
        timezone: "America/Chicago",
        hide_side_toolbar: false,
        allow_symbol_change: true,
        studies: studies,
        studies_overrides: {
          "vwap.vwap.color": "#ffd600",                    
          "moving average.plot.color": "#aa00ff",          
          "moving average exponential.plot.color": "#00e5ff", // EMA 9 cyan
          "vwap.vwap.linewidth": 2,
          "moving average.plot.linewidth": 2,
          "moving average exponential.plot.linewidth": 2
        }
      });
    }

    makeChart("tv_spy", "AMEX:SPY", "5", STUDIES);
    makeChart("tv_vix", "CBOE:VIX", "5", []);
  </script>
</body>
</html>
